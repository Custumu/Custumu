version: '3.8'

services:
  # 1. Frontend Web SPA & Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '80:80'
      - '3000:80'
    depends_on:
      - api
    restart: always

  # 2. Express API Gateway
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    restart: always

  # 3. Headless Document Worker (LibreOffice + Ghostscript + Tesseract)
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always

  # 4. Redis Queue Broker
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
