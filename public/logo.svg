<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="layer-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Base Right Pillar (Royal Blue) -->
  <rect x="52" y="32" width="34" height="52" rx="14" fill="#2563EB" filter="url(#layer-shadow)"/>

  <!-- Middle Left Circle (Emerald Green) overlapping Blue Pillar -->
  <circle cx="38" cy="58" r="22" fill="#10B981" fill-opacity="0.95" filter="url(#layer-shadow)"/>

  <!-- Top Horizontal Pill (Amber) overlapping both -->
  <rect x="14" y="16" width="72" height="22" rx="11" fill="#F59E0B" filter="url(#layer-shadow)"/>
</svg>
